
# US-1.6: As a campus map user, I want to see additional information for each building, so that I can learn more about campus facilities.

appId: com.example.myapplication
---
- setLocation:
    latitude: 45.4972
    longitude: -73.5789
- launchApp:
    clearState: true
- assertVisible:
    text: "Search buildings or addresses..."
- assertVisible:
    text: "SGW"
- assertVisible:
    text: "LOY"
- assertVisible:
    text: "Map"
- assertVisible:
    text: "Schedule"

- tapOn:
    point: "80%, 83%"
- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    text: "SGW"
- waitForAnimationToEnd:
    timeout: 10000

