    id: "directions_dest_field"
- assertVisible:
    text: "PREVIEW"

- tapOn:
    id: "directions_close_button"
- waitForAnimationToEnd:
    timeout: 2000

- assertNotVisible:
    id: "directions_info_popup"
- assertNotVisible:
    id: "buildings_info_popup"

- assertVisible:
    id: "search_bar"
- assertVisible:
    id: "campus_map"
