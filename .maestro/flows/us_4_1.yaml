
# US-4.1: As a student, I want to be able to search for specific room numbers on the indoor map, so that I can see exactly where my destination is within the building layout.

appId: com.example.myapplication
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 5000

- waitForAnimationToEnd:
    timeout: 10000

- assertVisible:
    text: "Search buildings or addresses..."
- assertVisible:
    text: "SGW"
- assertVisible:
    text: "LOY"
- assertVisible:
    text: "Map"
- assertVisible:
    text: "Schedule"

- tapOn:
    text: "SGW"
- waitForAnimationToEnd:
    timeout: 10000

# Tap on Hall building
- tapOn:
    point: "50%, 47%"
- waitForAnimationToEnd:
    timeout: 10000

- assertVisible:
    text: "Henry F. Hall Building"
- assertVisible: "Directions"
- assertVisible: "Indoor"
- assertVisible: "PIN"
- assertVisible: "Share"

- tapOn: "Indoor"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    text: "H · Floor 1"

- tapOn: "2"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    text: "H · Floor 2"

- tapOn: "8"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    text: "H · Floor 8"

- tapOn: "9"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    text: "H · Floor 9"

- tapOn: "Back"

- assertVisible:
    text: "Henry F. Hall Building"
- assertVisible: "Directions"
- assertVisible: "Indoor"
- assertVisible: "PIN"
- assertVisible: "Share"
