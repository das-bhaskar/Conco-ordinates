appId: com.example.myapplication
---

# Scenario 1
- setLocation:
    latitude: 45.4377
    longitude: -73.47379

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "Search buildings or addresses"
    timeout: 15000

# Handle permissions
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Allow"
    optional: true

- tapOn:
    point: "80%, 83%"

- extendedWaitUntil:
    visible:
      text: "Search buildings or addresses"
    timeout: 10000

- tapOn:
    text: "Search buildings or addresses"

# 🔑 IMPORTANT: type + press enter
- inputText: "Vanier"
- pressKey: Enter

# 🔑 Wait for results (NOT immediate)
- extendedWaitUntil:
    visible:
      text: "Vanier"
    timeout: 15000

# Try exact match first
- tapOn:
    text: "Vanier Library"
    optional: true

# Fallback if text slightly different
- tapOn:
    text: "Vanier"
    optional: true

- takeScreenshot: after-search-selection

# Wait for details screen
- extendedWaitUntil:
    visible:
      text: "Vanier"
    timeout: 15000

# Scroll if needed
- scrollUntilVisible:
    element:
      text: "Directions"
    direction: DOWN
    timeout: 10000

- tapOn:
    text: "Directions"

- extendedWaitUntil:
    visible:
      text: "Your position"
    timeout: 15000

- assertVisible:
    text: "Walk"
- assertVisible:
    text: "Drive"
- assertVisible:
    text: "Transit"
- assertVisible:
    text: "Shuttle"

- tapOn: "Drive"

- extendedWaitUntil:
    visible:
      text: "Start"
    timeout: 10000
