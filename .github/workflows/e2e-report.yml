name: Android E2E Local Emulator

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read
  pull-requests: write

jobs:
  e2e-local:
    name: Maestro E2E on Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
      REPORT_DIR: e2e-report
      TEST_OUTPUT_DIR: e2e-test-output

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --version

      - name: Grant execute permission
        run: |
          chmod +x gradlew
          chmod +x scripts/run_e2e.sh

      - name: Create local.properties
        env:
          MAPS_VAR: ${{ secrets.MAPS_API_KEY || 'unused' }}
        run: |
          echo "MAPS_API_KEY=\"$MAPS_VAR\"" > local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run Maestro tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash ./scripts/run_e2e.sh

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e-report/
            e2e-test-output/
          if-no-files-found: ignore
