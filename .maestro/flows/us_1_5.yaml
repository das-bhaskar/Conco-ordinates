
# US-1.5: As a campus map user, I want the map to show the building I am currently located in, so that I know my current position on campus.
#
# We cannot test the color of buildings directly but we can make sure the application does not crash when a users
# location is a campus building.

appId: com.example.myapplication
---
- setLocation:
    latitude: 45.4972
    longitude: -73.5789
- launchApp:
    clearState: true
- assertVisible:
    id: "search_bar"
- assertVisible:
    id: "campus_map"
- assertVisible:
    id: "campus_toggle"
- assertVisible:
    id: "LOY_button"
- assertVisible:
    id: "SGW_button"
- assertVisible: "RECENTER"
- assertVisible:
    id: "app_nav"
- assertVisible:
    id: "map_option"
- assertVisible:
    id: "schedule_option"
- assertVisible:
    id: "google_map"

# Give time to the application to load the new location
- waitForAnimationToEnd:
    timeout: 10000

- assertVisible:
    id: "search_bar"
- assertVisible:
    id: "campus_map"
- assertVisible:
    id: "campus_toggle"
- assertVisible:
    id: "LOY_button"
- assertVisible:
    id: "SGW_button"
- assertVisible: "RECENTER"
- assertVisible:
    id: "app_nav"
- assertVisible:
    id: "map_option"
- assertVisible:
    id: "schedule_option"
- assertVisible:
    id: "google_map"

# Assert that the app does not crash when out of campus
- setLocation:
    latitude: 45.4377
    longitude: -73.47379

# Give time to the application to load the new location
- waitForAnimationToEnd:
    timeout: 10000

- assertVisible:
    id: "search_bar"
- assertVisible:
    id: "campus_map"
- assertVisible:
    id: "campus_toggle"
- assertVisible:
    id: "LOY_button"
- assertVisible:
    id: "SGW_button"
- assertVisible: "RECENTER"
- assertVisible:
    id: "app_nav"
- assertVisible:
    id: "map_option"
- assertVisible:
    id: "schedule_option"
- assertVisible:
    id: "google_map"