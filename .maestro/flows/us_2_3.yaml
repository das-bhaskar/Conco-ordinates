
#US-2.3: As a campus map user, I want directions to be shown on the map, so that I can visually follow the route.

appId: com.example.myapplication
---
# Scenario 1: Tap on a building for directions
- launchApp:
    clearState: true
- assertVisible:
    id: "search_bar"
- assertVisible:
    id: "campus_map"
- assertVisible:
    id: "campus_toggle"
- assertVisible:
    id: "LOY_button"
- assertVisible:
    id: "SGW_button"
- assertVisible: "RECENTER"
- assertVisible:
    id: "app_nav"
- assertVisible:
    id: "map_option"
- assertVisible:
    id: "schedule_option"

- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    id: "SGW_button"
- waitForAnimationToEnd:
    timeout: 5000

# Tap on Hall building
- tapOn:
    point: 50% 47%
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "building_info_popup"

- tapOn:
    id: "directions_option"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "directions_info_popup"

- assertVisible:
    id: "directions_start_field"
- assertVisible:
    id: "directions_dest_field"
- assertVisible:
    text: "PREVIEW"

- tapOn:
    id: "directions_close_button"
- waitForAnimationToEnd:
    timeout: 2000

- assertNotVisible:
    id: "directions_info_popup"
- assertNotVisible:
    id: "buildings_info_popup"

- assertVisible:
    id: "search_bar"
- assertVisible:
    id: "campus_map"
- assertVisible:
    id: "campus_toggle"
- assertVisible:
    id: "LOY_button"
- assertVisible:
    id: "SGW_button"
- assertVisible: "RECENTER"
- assertVisible:
    id: "app_nav"
- assertVisible:
    id: "map_option"
- assertVisible:
    id: "schedule_option"

# Scenario 2: Search for a building and get directions
- launchApp:
    clearState: true
- assertVisible:
    id: "search_bar"
- assertVisible:
    id: "campus_map"
- assertVisible:
    id: "campus_toggle"
- assertVisible:
    id: "LOY_button"
- assertVisible:
    id: "SGW_button"
- assertVisible: "RECENTER"
- assertVisible:
