name: E2E Sprint Report

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read
  pull-requests: write

jobs:
  e2e-test-coverage:
    # Switched to macOS for hardware acceleration (required for stable Emulator)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Create local.properties
        env:
          MAPS_VAR: ${{ secrets.MAPS_API_KEY || 'unused' }}
        run: echo "MAPS_API_KEY=\"$MAPS_VAR\"" > local.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Run E2E Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu libguest -no-snapshot -noaudio -no-boot-anim -accel on
          # Note: script lines are joined by newlines; the shell handles the 'for' loop correctly on macOS
          script: |

            # Increase ADB timeout for slow initial connections
            export ADB_INSTALL_TIMEOUT=5
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            echo "Waiting for package to be registered..."
            for i in {1..15}; do
              if adb shell pm list packages | grep -q "com.example.concoordinates"; then
                echo "Package found!"
                break
              fi
              echo "Retrying ($i/15)..."
              sleep 5
            done

            echo "Granting permissions..."
            adb shell pm grant com.example.concoordinates android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant com.example.concoordinates android.permission.ACCESS_COARSE_LOCATION || true

            echo "Installing Maestro..."
            curl -Ls "https://get.maestro.mobile.dev" | bash
            export PATH="$PATH:$HOME/.maestro/bin"

            mkdir -p e2e-report
            echo "Running Maestro flows..."
            maestro test .maestro/flows/ --format junit --output e2e-report/report.xml

      - name: Run Unit Tests and Generate Merged Coverage
        run: ./gradlew testDebugUnitTest jacocoTestReport --info --continue

      - name: Upload E2E Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sprint-E2E-Coverage
          path: |
            e2e-report/
            app/build/reports/jacoco/jacocoTestReport/html/

      - name: PR Coverage Reporter
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: ${{ github.workspace }}/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Combined E2E + Unit Coverage Report"
          update-comment: true
