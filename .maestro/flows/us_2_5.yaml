
# US-2.5: As a campus map user, I want to be able to choose between walking, driving, and public transportation, so that I can travel using my preferred method based on the weather or my schedule.

appId: com.example.myapplication
---
# Scenario 1: Tap on a building for directions
- launchApp:
    clearState: true
- assertVisible:
    id: "search_bar"
- assertVisible:
    id: "campus_map"
- assertVisible:
    id: "campus_toggle"
- assertVisible:
    id: "LOY_button"
- assertVisible:
    id: "SGW_button"
- assertVisible: "RECENTER"
- assertVisible:
    id: "app_nav"
- assertVisible:
    id: "map_option"
- assertVisible:
    id: "schedule_option"

- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    id: "SGW_button"
- waitForAnimationToEnd:
    timeout: 5000

# Tap on Hall building
- tapOn:
    point: 50% 47%
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "building_info_popup"

- tapOn:
    id: "directions_option"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "directions_info_popup"

- assertVisible:
    id: "directions_start_field"
- assertVisible:
    id: "directions_dest_field"
- assertVisible:
    text: "PREVIEW"
- assertVisible:
    id: "transport_mode_walk"
- assertVisible:
    id: "transport_mode_drive"
- assertVisible:
    id: "transport_mode_public"
- assertVisible:
    id: "transport_mode_shuttle"

- tapOn:
    id: "transport_mode_drive"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "transport_mode_drive"
- assertVisible:
    id: "directions_info_popup"

- tapOn:
    id: "transport_mode_public"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "transport_mode_public"
- assertVisible:
    id: "directions_info_popup"

- tapOn:
    id: "transport_mode_shuttle"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "transport_mode_shuttle"
- assertVisible:
    id: "directions_info_popup"

- tapOn:
    id: "transport_mode_walk"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "transport_mode_walk"
- assertVisible:
    id: "directions_info_popup"

# Scenario 2: Search for a building and get directions
- launchApp:
    clearState: true
- assertVisible:
    id: "search_bar"
- assertVisible:
    id: "campus_map"
- assertVisible:
    id: "campus_toggle"
- assertVisible:
    id: "LOY_button"
- assertVisible:
    id: "SGW_button"
- assertVisible: "RECENTER"
- assertVisible:
    id: "app_nav"
- assertVisible:
    id: "map_option"
- assertVisible:
    id: "schedule_option"

- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    id: "search_bar"
- inputText: "Vanier"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    text: "Vanier Library"
- waitForAnimationToEnd:
    timeout: 2000

- assertVisible:
    id: "building_info_popup"

- tapOn:
    id: "directions_option"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "directions_info_popup"

- assertVisible:
    id: "directions_start_field"
- assertVisible:
    id: "directions_dest_field"
- assertVisible:
    text: "PREVIEW"
- assertVisible:
    id: "transport_mode_walk"
- assertVisible:
    id: "transport_mode_drive"
- assertVisible:
    id: "transport_mode_public"
- assertVisible:
    id: "transport_mode_shuttle"

- tapOn:
    id: "transport_mode_drive"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "transport_mode_drive"
- assertVisible:
    id: "directions_info_popup"

- tapOn:
    id: "transport_mode_public"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "transport_mode_public"
- assertVisible:
    id: "directions_info_popup"

- tapOn:
    id: "transport_mode_shuttle"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "transport_mode_shuttle"
- assertVisible:
    id: "directions_info_popup"

- tapOn:
    id: "transport_mode_walk"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "transport_mode_walk"
- assertVisible:
    id: "directions_info_popup"
