name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build, Test, and Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "zulu"

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        env:
          MAPS_VAR: ${{ secrets.MAPS_API_KEY || 'unused' }}
        run: echo "MAPS_API_KEY=\"$MAPS_VAR\"" > local.properties

      - name: Run tests with coverage
        run: ./gradlew jacocoTestReport --info

      - name: Verify coverage report exists
        run: |
          echo "=== Looking for JaCoCo XML reports ==="
          find . -name "*.xml" -path "*/jacoco*" -type f
          echo ""
          echo "=== Checking expected path ==="
          ls -la app/build/reports/jacoco/jacocoTestReport/ || echo "Directory does not exist"
          echo ""
          echo "=== Checking .exec files ==="
          find . -name "*.exec" -type f

      - name: Run SonarCloud analysis
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
