name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build, Test, and Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "zulu"

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        env:
          MAPS_VAR: ${{ secrets.MAPS_API_KEY || 'unused' }}
        run: echo "MAPS_API_KEY=\"$MAPS_VAR\"" > local.properties

      - name: Compile debug classes
        run: ./gradlew compileDebugKotlin compileDebugJavaWithJavac --info

      - name: Run tests with coverage
        run: ./gradlew jacocoTestReport --info --continue

      - name: Verify binaries and coverage exist
        run: |
          echo "=== Kotlin classes ==="
          find app/build/intermediates/built_in_kotlinc -name "*.class" 2>/dev/null | head -5 || echo "NO KOTLIN CLASSES FOUND"
          echo ""
          echo "=== Java classes ==="
          find app/build/intermediates/javac/debug -name "*.class" 2>/dev/null | head -5 || echo "NO JAVA CLASSES FOUND"
          echo ""
          echo "=== JaCoCo XML content check ==="
          head -50 app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml 2>/dev/null || echo "XML NOT FOUND"

      - name: PR Coverage Reporter
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: ${{ github.workspace }}/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Unit Test Coverage Report"
          update-comment: true

      - name: Run SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
