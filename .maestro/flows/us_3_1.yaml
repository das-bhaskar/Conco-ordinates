
# US-3.1: As a student, I want to connect my Google Calendar, so that the app can automatically find my next class location and show me how to get there.

appId: com.example.myapplication
---
- launchApp:
    clearState: true
- assertVisible:
    text: "Search buildings or addresses..."
- assertVisible:
    text: "SGW"
- assertVisible:
    text: "LOY"
- assertVisible:
    text: "Map"
- assertVisible:
    text: "Schedule"

- tapOn:
    text: "schedule"
- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    text: "Connect"
    index: 1
- waitForAnimationToEnd:
    timeout: 10000

- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "SKIP"
    commands:
      - tapOn:
          text: "SKIP"
      - waitForAnimationToEnd:
          timeout: 5000

- runFlow:
    when:
      visible: "Choose an account"
    commands:
      - tapOn:
          text: "Conco-ordinates"

- runFlow:
    when:
      visible:
        id: "identifierId"
    commands:
      - tapOn:
          id: "identifierId"
      - waitForAnimationToEnd:
          timeout: 2000
      - inputText: "concoordinates@gmail.com"
      - tapOn:
          text: "NEXT"
      - tapOn: "Enter your password"
      - waitForAnimationToEnd:
          timeout: 2000
      - inputText: "A12345678?"
      - tapOn:
          text: "NEXT"
      - waitForAnimationToEnd:
          timeout: 2000
      - runFlow:
          when:
            visible: "I agree"
          commands:
            - tapOn: "I agree"
      - waitForAnimationToEnd:
          timeout: 20000
      - waitForAnimationToEnd:
          timeout: 20000

- waitForAnimationToEnd:
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 20000
- runFlow:
    when:
      visible: "MORE"
    commands:
      - tapOn:
          text: "MORE"
      - waitForAnimationToEnd:
          timeout: 5000

- runFlow:
    when:
      visible: "ACCEPT"
    commands:
      - tapOn:
          text: "ACCEPT"
      - waitForAnimationToEnd:
          timeout: 5000

- runFlow:
    when:
      visible: "Never lose your contacts"
    commands:
      - tapOn: "Don't Backup"
      - waitForAnimationToEnd:
          timeout: 5000
- assertVisible:
    text: "Choose a Calendar"
- assertVisible:
    text: "Map"
- assertVisible:
    text: "Schedule"
