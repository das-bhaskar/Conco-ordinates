
# US-2.5: As a campus map user, I want to be able to choose between walking, driving, and public transportation, so that I can travel using my preferred method based on the weather or my schedule.
# US-2.6: As a campus map user, I want shuttle service routes to be displayed, so that I can efficiently use the Concordia Shuttle.
# US-2.7: As a campus map user, I want the application to determine shuttle availability based on the current time, so that I only see shuttle routes when the service is operating.
# US-2.8: As a campus map user, I want the nearest shuttle stop to be identified, so that I know where to board.
#
# This test covers both user stories 2.5, 2.6, 2.7 and 2.8. Implementing an e2e test for US-2.6, US-2.7 or US-2.8 would be redundant since it
# is tested through US-2.5 e2e test.

appId: com.example.myapplication
---
# Scenario 1: Tap on a building for directions
- launchApp:
    clearState: true
- assertVisible:
    id: "search_bar"
- assertVisible:
    id: "campus_map"
- assertVisible:
    id: "campus_toggle"
- assertVisible:
    id: "LOY_button"
- assertVisible:
    id: "SGW_button"
- assertVisible: "RECENTER"
- assertVisible:
    id: "app_nav"
- assertVisible:
    id: "map_option"
- assertVisible:
    id: "schedule_option"

- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    id: "SGW_button"
- waitForAnimationToEnd:
    timeout: 5000

# Tap on Hall building
- tapOn:
    point: "50%, 47%"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "building_info_popup"

- tapOn:
    id: "directions_option"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "directions_info_popup"

- assertVisible:
    id: "directions_start_field"
- assertVisible:
    id: "directions_dest_field"
- assertVisible:
    text: "PREVIEW"
- assertVisible:
    id: "transport_mode_walk"
- assertVisible:
    id: "transport_mode_drive"
- assertVisible:
    id: "transport_mode_public"
- assertVisible:
    id: "transport_mode_shuttle"

- tapOn:
    id: "transport_mode_drive"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "transport_mode_drive"
- assertVisible:
    id: "directions_info_popup"

- tapOn:
    id: "transport_mode_public"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "transport_mode_public"
- assertVisible:
    id: "directions_info_popup"

- tapOn:
    id: "transport_mode_shuttle"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "transport_mode_shuttle"
- assertVisible:
    id: "directions_info_popup"
- assertNotVisible:
    text: "Fastest route"
- assertTrue:
    condition: ${visible("Next shuttle:") || visible("Shuttle out of service")}
- runFlow:
    when:
      visible: "Next shuttle:"
    commands:
      - assertVisible:
          text: "Nearest stop:"

- tapOn:
    id: "transport_mode_walk"
- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "transport_mode_walk"
- assertVisible:
    id: "directions_info_popup"

