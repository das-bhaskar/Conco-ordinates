# US-2.1: As a user, I want to select my start and destination points by either typing a building name or clicking a building on the map, so that I can plan my route with minimal effort.
# US-2.2: As a campus map user, I want my current building to be used as the starting point, so that I don’t have to manually select it.
#
# This test implements US-2.1 and US-2.2 making the implementation of an E2E test for US-2.2 redundant.

appId: com.example.myapplication
---
# Scenario 1: Type building name
# Set user location out of campus (Starbucks, Brossard)
- setLocation:
    latitude: 45.4377
    longitude: -73.47379

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "^Search buildings or addresses...$"
    timeout: 15000

# Optional permission handling
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Only this time"
    optional: true
- tapOn:
    text: "Allow"
    optional: true

- assertVisible:
    text: "^SGW$"
- assertVisible:
    text: "^LOY$"
- assertVisible:
    text: "^Map$"
- assertVisible:
    text: "^Schedule$"

- tapOn:
    point: "80%, 83%"

- extendedWaitUntil:
    visible:
      text: "^Search buildings or addresses...$"
    timeout: 10000

- tapOn:
    text: "^Search buildings or addresses...$"

- inputText: "Vanier"

- extendedWaitUntil:
    visible:
      text: "^Vanier Library$"
    timeout: 10000

- tapOn:
    text: "^Vanier Library$"

- takeScreenshot: scenario1-after-vanier-selection

# Wait for place/details state to appear
- extendedWaitUntil:
    visible:
      text: "Vanier Library"
    timeout: 15000

# In case Directions is lower in the sheet
- scrollUntilVisible:
    element:
      text: "^Directions$"
    direction: DOWN
    timeout: 10000

- takeScreenshot: scenario1-before-directions

- tapOn:
    text: "^Directions$"

- extendedWaitUntil:
    visible:
      text: "^Your position$"
    timeout: 15000

- assertVisible:
    text: "^Directions$"
- assertVisible:
    text: "^Your position$"
- assertVisible:
    text: "^Vanier Library$"
- assertVisible:
    text: "^Walk$"
- assertVisible:
    text: "^Drive$"
- assertVisible:
    text: "^Transit$"
- assertVisible:
    text: "^Shuttle$"

- tapOn:
    text: "^Drive$"

- extendedWaitUntil:
    visible:
      text: "^Start$"
    timeout: 10000

- assertVisible:
    text: "^Start$"

# Scenario 2: Tap on a building
# Set user location to LOYOLA campus (Vanier Library)
- setLocation:
    latitude: 45.459081
    longitude: -73.638709

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "^Search buildings or addresses...$"
    timeout: 15000

# Optional permission handling
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Only this time"
    optional: true
- tapOn:
    text: "Allow"
    optional: true

- assertVisible:
    text: "^SGW$"
- assertVisible:
    text: "^LOY$"
- assertVisible:
    text: "^Map$"
- assertVisible:
    text: "^Schedule$"

- tapOn:
    text: "^SGW$"

- waitForAnimationToEnd:
    timeout: 5000

- takeScreenshot: scenario2-before-map-tap

# Try a text-based tap first if available
- tapOn:
    text: "Hall"
    optional: true

# Fallback coordinate tap
- tapOn:
    point: "50%, 47%"

- takeScreenshot: scenario2-after-map-tap

# Wait for building details state
- extendedWaitUntil:
    visible:
      text: "Hall"
    timeout: 15000

- scrollUntilVisible:
    element:
      text: "^Directions$"
    direction: DOWN
    timeout: 10000

- takeScreenshot: scenario2-before-directions

- tapOn:
    text: "^Directions$"

- extendedWaitUntil:
    visible:
      text: "^Your position$"
    timeout: 15000

- assertVisible:
    text: "^Directions$"
- assertVisible:
    text: "^Your position$"
- assertVisible:
    text: "^Henry F\\. Hall Building$"
- assertVisible:
    text: "^Walk$"
- assertVisible:
    text: "^Drive$"
- assertVisible:
    text: "^Transit$"
- assertVisible:
    text: "^Shuttle$"

- tapOn:
    text: "^Drive$"

- extendedWaitUntil:
    visible:
      text: "^Start$"
    timeout: 10000

- assertVisible:
    text: "^Start$"
