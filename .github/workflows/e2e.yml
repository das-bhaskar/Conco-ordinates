
name: E2E Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  e2e_tests:
    name: E2E Tests
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Set up APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Set up Maestro CLI
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
        env:
          MAESTRO_VERSION: 1.36.0

      - name: Set up PATH
        run: echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          avd-name: maestro_ci
          emulator-options: -no-window -gpu swiftshader_indirect -noaudit -no-boot-anim
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            
            # Enable location permission
            adb shell pm grant com.example.myapplication \
              android.permission.ACCESS_FINE_LOCATION
            
            mkdir -p e2e-video-recordings e2e-report
            
            chmod +x scripts/run_e2e.sh
            
      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-recordings
          path: e2e-video-recordings/*.mp4

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e-report/*.xml

      - name: Display results on PR page
        if: always()
        uses: EnricoMi/publish-unit-test-result-action/macos@v2
        with:
          files: e2e-report/*.xml
