name: Android CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Create local.properties
        env:
          # If secret is missing, use 'unused' so the Java code is valid
          MAPS_VAR: ${{ secrets.MAPS_API_KEY || 'unused' }}
        run: echo "MAPS_API_KEY=\"$MAPS_VAR\"" > local.properties

      - name: Build Debug APK
        # No extra env vars needed here; Gradle reads local.properties
        run: ./gradlew assembleDebug

      - name: Run Unit Tests and Generate Coverage Report
        run: ./gradlew testDebugUnitTest jacocoTestReport
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Conco-ordinates-Debug-Build
          path: app/build/outputs/apk/debug/app-debug.apk