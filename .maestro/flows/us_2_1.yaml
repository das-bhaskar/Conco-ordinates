appId: com.example.myapplication
---

# Scenario 1
- setLocation:
    latitude: 45.4377
    longitude: -73.47379

- launchApp:
    clearState: true

# Wait for the main screen to be usable
- extendedWaitUntil:
    visible:
      text: "^Map$"
    timeout: 30000

# Handle permissions if they appear
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Only this time"
    optional: true
- tapOn:
    text: "Allow"
    optional: true

# Main UI checks
- assertVisible:
    text: "Search"
- assertVisible:
    text: "^SGW$"
- assertVisible:
    text: "^LOY$"
- assertVisible:
    text: "^Map$"
- assertVisible:
    text: "^Schedule$"

- takeScreenshot: main-screen-loaded

# Keep this for now if that button has no reliable text/id
- tapOn:
    point: "80%, 83%"

# Wait for search UI
- extendedWaitUntil:
    visible:
      text: "Search"
    timeout: 20000

- tapOn:
    text: "Search"

# Enter destination
- inputText: "Vanier"
- pressKey: Enter

# Wait for the actual search result, not just the typed query
- extendedWaitUntil:
    visible:
      text: "^Vanier Library$"
    timeout: 30000

- takeScreenshot: search-results-loaded

# Actually select the result
- tapOn:
    text: "^Vanier Library$"
    retryTapIfNoChange: true

- takeScreenshot: after-result-tap

# Wait for details sheet/button to appear
- extendedWaitUntil:
    visible:
      text: "^Directions$"
    timeout: 30000

# In case the sheet is partially collapsed
- scrollUntilVisible:
    element:
      text: "^Directions$"
    direction: DOWN
    timeout: 20000

- takeScreenshot: before-directions

- tapOn:
    text: "^Directions$"
    retryTapIfNoChange: true

# Wait for directions UI
- extendedWaitUntil:
    visible:
      text: "^Your position$"
    timeout: 30000

- assertVisible:
    text: "^Walk$"
- assertVisible:
    text: "^Drive$"
- assertVisible:
    text: "^Transit$"
- assertVisible:
    text: "^Shuttle$"

- tapOn:
    text: "^Drive$"

- extendedWaitUntil:
    visible:
      text: "^Start$"
    timeout: 15000
