name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "zulu"
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Create local.properties
        env:
          # This maps the secret to a variable. If secret is missing, it uses 'unused'
          MAPS_VAR: ${{ secrets.MAPS_API_KEY || 'unused' }}
        run: echo "MAPS_API_KEY=\"$MAPS_VAR\"" > local.properties
      - name: Build
        run: ./gradlew assembleDebug
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Run Unit Tests and Generate Coverage Report
        run: ./gradlew testDebugUnitTest jacocoTestReport
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Debug - Show JaCoCo XML content
        run: |
          echo "=== Finding XML ==="
          find . -name "jacocoTestReport.xml"
          echo "=== XML Content ==="
          cat app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          echo "=== Kotlin class files ==="
          find . -path "*/tmp/kotlin-classes/debug" -type d
          find . -path "*/tmp/kotlin-classes/debug/*.class" | head -20

      - name: Debug - Find class files
        run: |
          echo "=== tmp/kotlin-classes ==="
          find app/build/tmp/kotlin-classes -name "*.class" 2>/dev/null | head -20 || echo "DIRECTORY NOT FOUND"
          echo "=== XML first 30 lines ==="
          cat app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml | head -30 || echo "XML NOT FOUND"  

      - name: Run SonarQube analysis
        uses: SonarSource/sonarcloud-github-action@master
        with:
          args: -Dsonar.branch.name=main -Dsonar.branch.autoconfig.enabled=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
