
# US-3.1: As a student, I want to connect my Google Calendar, so that the app can automatically find my next class location and show me how to get there.

appId: com.example.myapplication
---
- launchApp:
    clearState: true
- assertVisible:
    text: "Search buildings or addresses..."
- assertVisible:
    text: "SGW"
- assertVisible:
    text: "LOY"
- assertVisible:
    text: "Map"
- assertVisible:
    text: "Schedule"

- tapOn:
    text: "schedule"
- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    text: "Connect"
    index: 1
- waitForAnimationToEnd:
    timeout: 10000

- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    text: "SKIP"
- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    id: "identifierId"
- waitForAnimationToEnd:
    timeout: 2000
- inputText: "concoordinates@gmail.com"
- tapOn:
    text: "NEXT"
- tapOn: "Enter your password"
- waitForAnimationToEnd:
    timeout: 2000
- inputText: "A12345678?"
- tapOn:
    text: "NEXT"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "I agree"
- waitForAnimationToEnd:
    timeout: 20000
- assertVisible:
    text: "Choose a Calendar"
- assertVisible:
    text: "Map"
- assertVisible:
    text: "Schedule"
