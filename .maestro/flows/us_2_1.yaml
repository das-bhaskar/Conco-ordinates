appId: com.example.myapplication
---

# Scenario 1
- setLocation:
    latitude: 45.4377
    longitude: -73.47379

- launchApp:
    clearState: true

# Wait for the main screen to load first
- extendedWaitUntil:
    visible:
      text: "Map"
    timeout: 20000

# Handle permissions if they appear
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Only this time"
    optional: true
- tapOn:
    text: "Allow"
    optional: true

# Assert main UI more loosely for CI stability
- assertVisible:
    text: "Search"
- assertVisible:
    text: "SGW"
- assertVisible:
    text: "LOY"
- assertVisible:
    text: "Map"
- assertVisible:
    text: "Schedule"

- takeScreenshot: main-screen-loaded

- tapOn:
    point: "80%, 83%"

# Wait for search UI
- extendedWaitUntil:
    visible:
      text: "Search"
    timeout: 15000

- tapOn:
    text: "Search"

# Type destination
- inputText: "Vanier"
- pressKey: Enter

# Wait for results
- extendedWaitUntil:
    visible:
      text: "Vanier"
    timeout: 20000

# Try exact result first
- tapOn:
    text: "Vanier Library"
    optional: true

# Fallback if exact text differs
- tapOn:
    text: "Vanier"
    optional: true

- takeScreenshot: after-search-selection

# Wait for details screen / bottom sheet
- extendedWaitUntil:
    visible:
      text: "Vanier"
    timeout: 20000

# Scroll in case Directions is lower in the sheet
- scrollUntilVisible:
    element:
      text: "Directions"
    direction: DOWN
    timeout: 10000
    
- extendedWaitUntil:
    visible:
      text: "Directions"
    timeout: 10000
    
- takeScreenshot: before-directions

- tapOn:
    text: "Directions"

# Wait for directions UI
- extendedWaitUntil:
    visible:
      text: "Your position"
    timeout: 20000

- assertVisible:
    text: "Walk"
- assertVisible:
    text: "Drive"
- assertVisible:
    text: "Transit"
- assertVisible:
    text: "Shuttle"

- tapOn:
    text: "Drive"

- extendedWaitUntil:
    visible:
      text: "Start"
    timeout: 10000
